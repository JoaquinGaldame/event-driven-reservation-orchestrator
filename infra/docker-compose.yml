services:
  postgres:
    image: postgres:16
    container_name: ero-postgres
    environment:
      POSTGRES_USER: reservation_user
      POSTGRES_PASSWORD: reservation_pass
      POSTGRES_DB: reservation_orchestrator
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: ero-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
volumes:
  postgres_data: